
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Divya Drishti | Vedic Astrology</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400;700&family=Noto+Serif+Devanagari:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              saffron: {
                50: '#fff8e1',
                100: '#ffecb3',
                200: '#ffe082',
                300: '#ffd54f',
                400: '#ffca28',
                500: '#ffc107',
                600: '#ffb300',
                700: '#ffa000',
                800: '#ff8f00',
                900: '#ff6f00',
              },
              maroon: {
                800: '#5a0a0a',
                900: '#3d0505',
                950: '#1a0505',
              },
              gold: '#D4AF37',
            },
            fontFamily: {
              serif: ['Cinzel', 'Noto Serif Devanagari', 'serif'],
              sans: ['Lato', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
              'fade-in-up': 'fadeInUp 0.8s ease-out',
              'slide-up': 'slideUp 0.5s ease-out',
              'shimmer': 'shimmer 2.5s infinite linear',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              slideUp: {
                '0%': { transform: 'translateY(100%)' },
                '100%': { transform: 'translateY(0)' },
              },
              shimmer: {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(100%)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0f0404;
        color: #fce7cf;
        overflow-x: hidden;
        /* Protection: Disable Text Selection */
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      /* Professional Print Styles */
      @media print {
        body {
          background-color: #ffffff !important;
          color: #000000 !important;
          -webkit-user-select: text !important;
          -moz-user-select: text !important;
          -ms-user-select: text !important;
          user-select: text !important;
        }

        /* Hide unnecessary elements */
        nav, footer, button, .data-html2canvas-ignore {
          display: none !important;
        }

        /* Ensure content is visible */
        html, body {
          display: block !important;
        }

        /* Remove backgrounds and shadows */
        * {
          box-shadow: none !important;
          text-shadow: none !important;
        }

        /* Ensure high contrast */
        .text-saffron-200, .text-saffron-100, .text-saffron-300, .text-saffron-400 {
          color: #000000 !important;
        }

        .text-saffron-500, .text-saffron-600, .text-saffron-800, .text-saffron-900 {
          color: #333333 !important;
        }

        /* Backgrounds */
        .bg-maroon-900, .bg-black, .bg-maroon-900\/30, .bg-maroon-900\/60, .bg-black\/20, .bg-black\/40 {
          background-color: #ffffff !important;
        }

        .bg-saffron-900\/20, .bg-saffron-900\/40, .bg-saffron-900\/80 {
          background-color: #f5f5f5 !important;
        }

        /* Borders */
        .border-saffron-900\/30, .border-saffron-900\/50, .border-saffron-800 {
          border-color: #cccccc !important;
        }

        /* Status badges */
        .bg-green-900\/40, .bg-green-100 {
          background-color: #d4edda !important;
          color: #155724 !important;
        }

        .bg-red-900\/40, .bg-red-100 {
          background-color: #f8d7da !important;
          color: #721c24 !important;
        }

        .bg-yellow-900\/20, .bg-yellow-100 {
          background-color: #fff3cd !important;
          color: #856404 !important;
        }

        /* Numerology & Gemstone specific */
        .bg-saffron-800\/50 {
          background-color: #e9ecef !important;
          color: #000000 !important;
        }

        .bg-saffron-900\/30 {
          background-color: #f8f9fa !important;
          border-color: #dee2e6 !important;
        }

        /* Icons */
        .text-saffron-500, .text-saffron-400, .text-green-400, .text-yellow-400, .text-red-400 {
          color: #495057 !important;
        }

        /* Page setup */
        @page {
          margin: 15mm;
          size: A4;
        }

        /* Professional border for print */
        body::before {
          content: '';
          position: fixed;
          top: 10mm;
          left: 10mm;
          right: 10mm;
          bottom: 10mm;
          border: 3px solid #8B4513;
          border-radius: 5px;
          pointer-events: none;
          z-index: 9999;
        }

        /* Inner decorative border */
        body::after {
          content: '';
          position: fixed;
          top: 12mm;
          left: 12mm;
          right: 12mm;
          bottom: 12mm;
          border: 1px solid #D2691E;
          border-radius: 3px;
          pointer-events: none;
          z-index: 9998;
        }

        /* Professional header for print */
        #chart-report::before {
          content: 'ॐ श्री गणेशाय नमः';
          display: block;
          text-align: center;
          font-size: 24px;
          font-weight: bold;
          color: #8B4513;
          margin-bottom: 20px;
          padding-bottom: 10px;
          border-bottom: 2px solid #D2691E;
        }

        /* Professional footer for print */
        #chart-report::after {
          content: 'Generated by Divya Drishti - Sacred & Pure';
          display: block;
          text-align: center;
          font-size: 12px;
          color: #666;
          margin-top: 30px;
          padding-top: 10px;
          border-top: 1px solid #ccc;
        }

        /* Report container styling */
        #chart-report, #numerology-report, #gemstones-report {
          background: #FFF8DC !important;
          padding: 10mm !important;
          border: none !important;
        }

        /* Section headings */
        h1, h2, h3, h4 {
          color: #8B4513 !important;
          font-family: 'Georgia', serif !important;
          border-bottom: 1px solid #D2691E !important;
          padding-bottom: 5px !important;
          margin-bottom: 15px !important;
        }

        /* Card styling */
        .bg-saffron-900\/20, .bg-saffron-900\/30 {
          background: #FFE4B5 !important;
          border: 1px solid #D2691E !important;
          border-radius: 5px !important;
        }
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #2d0a0a;
      }
      ::-webkit-scrollbar-thumb {
        background: #8e2b0b;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #b53a10;
      }
    </style>

  "imports": {

</script>
